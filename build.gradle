plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ru.practicum'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Веб-слой: включает spring-webmvc, spring-web, jackson-databind, встроенный Tomcat и validation
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Работа с БД: включает spring-data-jdbc, spring-jdbc и HikariCP (пул соединений)
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'

    // Драйвер базы данных
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Включает JUnit 5, Spring Test, Mockito, Hamcrest, JsonPath
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}